[project]
name = "ainvest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "requests>=2.32.0",
    "agno>=2.0.8",
    "authlib>=1.6.4",
    "cachetools>=5.5.2",
    "ddgs>=9.6.0",
    "google-cloud-firestore>=2.21.0",
    "google-genai>=1.38.0",
    "gspread>=6.2.1",
    "pydash>=8.0.5",
    "python-box>=7.3.2",
    "yfinance>=0.2.66",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.7",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["app"]
