<!DOCTYPE html>
<html lang="en" class="bg-white text-gray-900">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans text-sm leading-relaxed">

  <div class="max-w-3xl mx-auto px-6 py-10 pb-16">

    <!-- Header -->
    <header class="border-b border-gray-200 pb-5 mb-8">
      <h1 class="text-2xl font-bold tracking-tight">
        {{ title }}
        <span class="inline-block align-middle ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 border border-blue-200">
          v{{ version }}
        </span>
      </h1>
      <p class="mt-1 text-gray-500">{{ description }}</p>
    </header>

    <!-- Status bar -->
    <div class="flex items-center gap-4 bg-gray-50 border border-gray-200 rounded-md px-4 py-3 mb-8 text-xs text-gray-500">
      <span class="w-2.5 h-2.5 rounded-full flex-shrink-0 {{ 'bg-green-500' if status == 'ok' else 'bg-red-500' }}"></span>
      <span>Status: <strong class="text-gray-800">{{ status }}</strong></span>
      <span class="text-gray-300">·</span>
      <span>Server time: <strong class="text-gray-800">{{ server_time }}</strong></span>
    </div>

    <!-- Endpoints table -->
    <h2 class="text-sm font-semibold mb-3">Menu</h2>
    <div class="mb-8 rounded-md border border-gray-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-gray-50">
            <!-- <th class="text-left text-xs font-semibold uppercase tracking-wide text-gray-400 px-4 py-2 border-b border-gray-200 w-20">Method</th> -->
            <th class="text-left text-xs font-semibold uppercase tracking-wide text-gray-400 px-4 py-2 border-b border-gray-200">Description</th>
            <th class="text-left text-xs font-semibold uppercase tracking-wide text-gray-400 px-4 py-2 border-b border-gray-200">Path</th>
          </tr>
        </thead>
        <tbody>
          {% for ep in endpoints %}
          <tr class="{{ 'bg-white' if loop.index is odd else 'bg-gray-50/50' }}">
            <!-- <td class="px-4 py-2.5 align-top">
              {% if ep.method == 'GET' %}
                <span class="inline-block text-xs font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-700 min-w-[44px] text-center">GET</span>
              {% elif ep.method == 'POST' %}
                <span class="inline-block text-xs font-bold px-2 py-0.5 rounded bg-green-100 text-green-700 min-w-[44px] text-center">POST</span>
              {% elif ep.method == 'PUT' %}
                <span class="inline-block text-xs font-bold px-2 py-0.5 rounded bg-yellow-100 text-yellow-700 min-w-[44px] text-center">PUT</span>
              {% else %}
                <span class="inline-block text-xs font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-600 min-w-[44px] text-center">{{ ep.method }}</span>
              {% endif %}
            </td> -->
            <td class="px-4 py-2.5 align-top text-gray-500">{{ ep.description }}</td>
            <td class="px-4 py-2.5 align-top">
              <a class="text-xs bg-blue-100 hover:bg-blue-200 text-blue-800 px-2 py-1 rounded" href="{{ ep.path }}">GOTO</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <!-- Quick links -->
    <div class="flex flex-wrap gap-3 mb-10">
      <a href="/docs"   class="text-xs font-medium px-4 py-2 rounded border border-gray-200 bg-gray-50 text-blue-600 hover:bg-blue-50 transition-colors">Interactive docs (Swagger UI) →</a>
      <a href="/redoc"  class="text-xs font-medium px-4 py-2 rounded border border-gray-200 bg-gray-50 text-blue-600 hover:bg-blue-50 transition-colors">ReDoc →</a>
      <a href="/health" class="text-xs font-medium px-4 py-2 rounded border border-gray-200 bg-gray-50 text-blue-600 hover:bg-blue-50 transition-colors">Health check →</a>
    </div>

  </div>

  <!-- Footer -->
  <footer class="border-t border-gray-200 mt-4 py-4 text-center text-xs text-gray-400">
    Made with IBM Bob
  </footer>

</body>
</html>
